<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <marker id="arrow-vehicle"
        viewBox="0 0 10 10"
        markerWidth="14" markerHeight="14"
        refX="5" refY="5"
        orient="auto-start-reverse"
        markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E88A33"/>
    </marker>
    <marker id="arrow-pedestrian"
        viewBox="0 0 10 10"
        markerWidth="14" markerHeight="14"
        refX="5" refY="5"
        orient="auto-start-reverse"
        markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#65AFC4"/>
    </marker>
    <style>
      text { font-family: "Source Han Sans CN", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #4B5149; }
      .title { font-size: 24px; font-weight: 500; }
      .subtitle { font-size: 15px; font-weight: 400; fill: #6E746B; }
      .body { font-size: 12px; font-weight: 400; }
      .label { font-size: 12px; font-weight: 500; }
      .tiny { font-size: 10px; fill: #777B73; }
      .panel { fill: #FFFDF8; stroke: #D8D5CB; stroke-width: 1; }
      .divider { stroke: #D8D5CB; stroke-width: 1; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#F7F4EC"/>
  <rect x="20" y="18" width="760" height="564" fill="#FFFDF8" stroke="#D8D5CB" stroke-width="1"/>

  <text x="42" y="52" class="title">26-BQ-PARK 风格样卡 v1</text>
  <text x="42" y="78" class="subtitle">基于启泰 P52/P54 + var_4：底部图例、低饱和分区、暖橙/青蓝流线</text>

  <g id="palette-section">
    <rect x="42" y="104" width="338" height="172" class="panel"/>
    <text x="62" y="130" class="label">色块网格 · palette</text>
    <g transform="translate(62 148)">
      <rect width="68" height="34" fill="#AFC7A1"/><text x="0" y="50" class="tiny">primary</text><text x="0" y="64" class="tiny">#AFC7A1</text>
      <rect x="82" width="68" height="34" fill="#E88A33"/><text x="82" y="50" class="tiny">accent</text><text x="82" y="64" class="tiny">#E88A33</text>
      <rect x="164" width="68" height="34" fill="#4B5149"/><text x="164" y="50" class="tiny">neutral</text><text x="164" y="64" class="tiny">#4B5149</text>
      <rect x="246" width="68" height="34" fill="#F7F4EC" stroke="#D8D5CB"/><text x="246" y="50" class="tiny">background</text><text x="246" y="64" class="tiny">#F7F4EC</text>
      <rect y="88" width="44" height="24" fill="#DCE8C8"/><rect x="52" y="88" width="44" height="24" fill="#C9D6BD"/><rect x="104" y="88" width="44" height="24" fill="#EAE1B8"/><rect x="156" y="88" width="44" height="24" fill="#DDD3C2"/><rect x="208" y="88" width="44" height="24" fill="#D8CCDC"/><rect x="260" y="88" width="44" height="24" fill="#BFD4D9"/>
      <text y="128" class="tiny">functional_zones: activity / woodland / children / plaza / service / water</text>
    </g>
  </g>

  <g id="typography-section">
    <rect x="404" y="104" width="334" height="172" class="panel"/>
    <text x="424" y="130" class="label">字号样本 · typography</text>
    <text x="424" y="162" style="font-size:24px;font-weight:500">总平面分析图</text>
    <text x="424" y="190" style="font-size:15px;fill:#6E746B">项目概况 / 设计要点 / 面积分配</text>
    <text x="424" y="218" class="body">正文 9pt：用于说明文字、面积表、技术备注。</text>
    <rect x="424" y="235" width="116" height="24" fill="#FFFDF8" stroke="#D8D5CB"/>
    <text x="436" y="252" class="label">活动草坪</text>
  </g>

  <g id="stroke-arrow-section">
    <rect x="42" y="300" width="338" height="130" class="panel"/>
    <text x="62" y="326" class="label">线样与箭头 · strokes / arrows</text>
    <path d="M64 356 C120 340, 178 372, 234 352" fill="none" stroke="#E88A33" stroke-width="5.2" stroke-linecap="butt" marker-start="url(#arrow-vehicle)" marker-end="url(#arrow-vehicle)"/>
    <text x="254" y="358" class="tiny">vehicle_flow 0.75mm</text>
    <path d="M64 386 C122 402, 174 372, 232 392" fill="none" stroke="#E88A33" stroke-width="4.0" stroke-dasharray="8 5" stroke-linecap="round"/>
    <text x="254" y="392" class="tiny">secondary dash</text>
    <path d="M64 416 C124 404, 172 432, 232 414" fill="none" stroke="#65AFC4" stroke-width="4.0" stroke-linecap="butt" marker-start="url(#arrow-pedestrian)" marker-end="url(#arrow-pedestrian)"/>
    <text x="254" y="420" class="tiny">pedestrian 0.55mm</text>
  </g>

  <g id="label-entrance-section">
    <rect x="404" y="300" width="334" height="130" class="panel"/>
    <text x="424" y="326" class="label">入口与标签 · labels</text>
    <path d="M436 360 L452 386 L420 386 Z" fill="#D9483B"/><text x="466" y="381" class="body">车行主入口</text>
    <path d="M436 410 L452 384 L420 384 Z" transform="translate(0 12)" fill="#3F8CC3"/><text x="466" y="432" class="body">人行主入口</text>
    <path d="M610 360 L626 386 L594 386 Z" fill="#E9943A"/><text x="640" y="381" class="body">后勤入口</text>
    <path d="M610 422 L626 396 L594 396 Z" fill="#65AFC4"/><text x="640" y="418" class="body">地下车库</text>
  </g>

  <g id="legend-section">
    <rect x="42" y="456" width="696" height="84" class="panel"/>
    <text x="62" y="482" class="label">底部图例 · legend bottom_strip / 4 columns</text>
    <line x1="108" y1="500" x2="108" y2="528" class="divider"/>
    <line x1="280" y1="500" x2="280" y2="528" class="divider"/>
    <line x1="452" y1="500" x2="452" y2="528" class="divider"/>
    <line x1="624" y1="500" x2="624" y2="528" class="divider"/>
    <rect x="62" y="505" width="18" height="12" fill="#DCE8C8"/><text x="88" y="516" class="tiny">活动草坪区</text>
    <line x1="304" y1="510" x2="354" y2="510" stroke="#E88A33" stroke-width="4" marker-end="url(#arrow-vehicle)"/><text x="364" y="514" class="tiny">车行主环路</text>
    <path d="M486 518 L498 500 L510 518 Z" fill="#D9483B"/><text x="520" y="514" class="tiny">车行入口</text>
    <line x1="650" y1="510" x2="702" y2="510" stroke="#D34A43" stroke-width="4" stroke-dasharray="8 5"/><text x="710" y="514" class="tiny">用地红线</text>
  </g>

  <g id="scale-north-section">
    <text x="42" y="566" class="tiny">scale_north: compass + bar, top_right · 10m × 4 segments</text>
    <line x1="616" y1="562" x2="696" y2="562" stroke="#4B5149" stroke-width="3"/>
    <line x1="616" y1="556" x2="616" y2="568" stroke="#4B5149" stroke-width="2"/>
    <line x1="636" y1="556" x2="636" y2="568" stroke="#4B5149" stroke-width="2"/>
    <line x1="656" y1="556" x2="656" y2="568" stroke="#4B5149" stroke-width="2"/>
    <line x1="676" y1="556" x2="676" y2="568" stroke="#4B5149" stroke-width="2"/>
    <line x1="696" y1="556" x2="696" y2="568" stroke="#4B5149" stroke-width="2"/>
    <text x="610" y="580" class="tiny">0</text><text x="688" y="580" class="tiny">40m</text>
    <circle cx="740" cy="560" r="18" fill="none" stroke="#4B5149" stroke-width="1.4"/>
    <line x1="740" y1="542" x2="740" y2="578" stroke="#4B5149" stroke-width="1.4"/>
    <text x="735" y="535" class="tiny">N</text>
  </g>
</svg>
