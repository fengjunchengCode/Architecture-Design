schema_version: "1.0"

folders:
  - path: 01_briefing
    label: "需求类"
    required: true
    items:
      - pattern: "brief.*"
        ext: [doc, docx, pdf, md, txt]
        min: 0
        max: 1
        required: false
      - pattern: "supplement_*.*"
        ext: [txt, md, doc, docx, jpg, png]
        min: 0
        max: 999
        required: false

  - path: 02_site/区位图
    label: "区位图"
    required: true
    items:
      - pattern: "*.*"
        ext: [png, jpg, jpeg, pdf]
        min: 1
        max: 999
        required: true
        unblocks: [S0, S1]

  - path: 02_site/地形图
    label: "地形图"
    required: true
    items:
      - pattern: "topo_*.dwg"
        ext: [dwg]
        min: 0
        max: 999
        required: false
        unblocks: [S2, S3b]
      - pattern: "*.*"
        ext: [pdf, jpg, png, dwg]
        min: 0
        max: 999
        required: false

  - path: 02_site/现场照片
    label: "现场照片"
    required: true
    items:
      - pattern: "*.*"
        ext: [jpg, jpeg, png, heic]
        min: 0
        max: 999
        required: false

  - path: 03_references
    label: "参考案例"
    required: true
    items:
      - pattern: "ref_*.*"
        ext: [jpg, png, pdf, md]
        min: 0
        max: 999
        required: false

  - path: 04_chat
    label: "聊天记录"
    required: true
    items:
      - pattern: "chat_*.*"
        ext: [txt, html, md]
        min: 0
        max: 999
        required: false

  - path: 05_output
    label: "产出"
    required: true
    items:
      - pattern: "drawings/base/*"
        ext: [jpg, jpeg, png, webp, svg]
        min: 0
        max: 999
        required: false
      - pattern: "drawings/semantic/*.json"
        ext: [json]
        min: 0
        max: 999
        required: false
      - pattern: "report/*"
        ext: [md, html, pdf, png, jpg, json]
        min: 0
        max: 999
        required: false
      - pattern: "ppt/*"
        ext: [pptx, html, md, json, png, jpg]
        min: 0
        max: 999
        required: false

vision_route:
  output_dir: 05_output/vision
  provider_env: VISION_PROVIDER
  default_provider: openai
  api_key_env: OPENAI_API_KEY
  model_env: VISION_MODEL
  fallback: write_sidecar_and_pending_questions
  buckets: [location_map, site_photo, reference]
  ext: [png, jpg, jpeg, webp]

amap_context:
  output_dir: 05_output/amap
  webservice_key_env: AMAP_WEBSERVICE_KEY
  context_file: s1_map_context.json
  raw_file: s1_amap_raw.json
  control_points_file: control_points.json
  coordinate_system: GCJ-02 / AMap
  ui_entry: _tools/uploader/server.py

drawing_workbench:
  output_dir: 05_output/drawings
  base_dir: 05_output/drawings/base
  semantic_dir: 05_output/drawings/semantic
  drawing_types: [functional_zoning, traffic_analysis]
  coordinate_mode: normalized_image_xy_0_1
  ui_entry: _tools/uploader/server.py?page=workbench

s0_ready_gate:
  required:
    - path: 02_site/区位图
      ext: [png, jpg, jpeg, pdf]
      min: 1
  recommended:
    - path: 01_briefing
      ext: [doc, docx, pdf, md, txt]
      min: 1
    - path: 04_chat
      ext: [txt, html, md]
      min: 1

project_type_overrides:
  renovation:
    extra_dirs:
      - 02_site/现状测绘
  cultural_tourism:
    extra_dirs:
      - 02_site/所广区范围
  street_scape:
    min_counts:
      02_site/现场照片: 3

rename:
  enable_pinyin: true
  lowercase: false
  replace_space_with: "_"
  allowed_chars: "[a-zA-Z0-9_\\-.]"
  strip_others: true
