schema_version: "1.0"

folders:
  - path: 01_briefing
    label: "需求类"
    required: true
    items:
      - pattern: "brief.*"
        ext: [docx, pdf, md]
        min: 0
        max: 1
        required: false
      - pattern: "supplement_*.*"
        ext: [txt, md, docx, jpg, png]
        min: 0
        max: 999
        required: false

  - path: 02_site/区位图
    label: "区位图"
    required: true
    items:
      - pattern: "*.*"
        ext: [png, jpg, jpeg, pdf]
        min: 1
        max: 999
        required: true
        unblocks: [S0, S1]

  - path: 02_site/地形图
    label: "地形图"
    required: true
    items:
      - pattern: "topo_*.dwg"
        ext: [dwg]
        min: 0
        max: 999
        required: false
        unblocks: [S2, S3b]
      - pattern: "*.*"
        ext: [pdf, jpg, png, dwg]
        min: 0
        max: 999
        required: false

  - path: 02_site/现场照片
    label: "现场照片"
    required: true
    items:
      - pattern: "*.*"
        ext: [jpg, jpeg, png, heic]
        min: 0
        max: 999
        required: false

  - path: 03_references
    label: "参考案例"
    required: true
    items:
      - pattern: "ref_*.*"
        ext: [jpg, png, pdf, md]
        min: 0
        max: 999
        required: false

  - path: 04_chat
    label: "聊天记录"
    required: true
    items:
      - pattern: "chat_*.*"
        ext: [txt, html, md]
        min: 0
        max: 999
        required: false

  - path: 05_output
    label: "产出"
    required: true
    items: []

s0_ready_gate:
  required:
    - path: 02_site/区位图
      ext: [png, jpg, jpeg, pdf]
      min: 1
  recommended:
    - path: 01_briefing
      ext: [docx, pdf, md, txt]
      min: 1
    - path: 04_chat
      ext: [txt, html, md]
      min: 1

project_type_overrides:
  renovation:
    extra_dirs:
      - 02_site/现状测绘
  cultural_tourism:
    extra_dirs:
      - 02_site/所广区范围
  street_scape:
    min_counts:
      02_site/现场照片: 3

rename:
  enable_pinyin: true
  lowercase: false
  replace_space_with: "_"
  allowed_chars: "[a-zA-Z0-9_\\-.]"
  strip_others: true
